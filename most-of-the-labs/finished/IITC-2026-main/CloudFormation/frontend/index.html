<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DataBite</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gradient-to-br from-slate-900 via-slate-800 to-slate-900 text-white font-sans">
  <header class="border-b border-indigo-500/20 bg-slate-900/80 backdrop-blur-md sticky top-0 z-50 p-5">
    <div class="max-w-6xl mx-auto flex justify-between items-center">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 bg-gradient-to-br from-indigo-500 to-purple-600 rounded-xl flex items-center justify-center font-bold text-lg">D</div>
        <span class="text-xl font-bold text-indigo-200">DataBite</span>
      </div>
      <div id="status" class="px-3 py-1.5 rounded-full text-xs font-medium border bg-yellow-500/10 border-yellow-500/30 text-yellow-400 flex items-center gap-2">
        <span id="status-dot" class="w-2 h-2 rounded-full bg-yellow-400 animate-pulse"></span>
        <span id="status-text">Checking...</span>
      </div>
    </div>
  </header>

  <main class="max-w-6xl mx-auto p-8">
    <h2 class="text-3xl font-bold mb-2">Dashboard</h2>
    <p class="text-slate-400 mb-8">Restaurant menu intelligence platform &mdash; served via CloudFront + S3</p>

    <div id="stats" class="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-10"></div>

    <h3 class="text-xl font-semibold mb-4">Restaurants</h3>
    <div id="restaurants" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 mb-10"></div>

    <h3 class="text-xl font-semibold mb-4">Menu Items</h3>
    <div id="menu" class="bg-slate-800/50 border border-slate-700/50 rounded-2xl overflow-hidden"></div>
  </main>

  <footer class="border-t border-slate-700/30 p-6 text-center text-slate-500 text-sm">
    DataBite &copy; 2025 &mdash; Frontend: S3 + CloudFront | Backend: EC2
  </footer>

  <script>
    let API = "";
    async function init() {
      try {
        let cfg = await (await fetch("/config.json")).json();
        API = cfg.apiUrl || "";
      } catch(e) {}
      load();
      setInterval(load, 10000);
    }

    async function load() {
      try {
        let r = await fetch(API + "/api/stats");
        if (!r.ok) throw 0;
        let s = await r.json();

        // Status: connected
        document.getElementById("status").className = "px-3 py-1.5 rounded-full text-xs font-medium border bg-emerald-500/10 border-emerald-500/30 text-emerald-400 flex items-center gap-2";
        document.getElementById("status-dot").className = "w-2 h-2 rounded-full bg-emerald-400 animate-pulse";
        document.getElementById("status-text").textContent = "API Connected";

        // Stats
        document.getElementById("stats").innerHTML =
          card("🏪", s.total_restaurants, "Restaurants", "indigo") +
          card("🍽️", s.total_menu_items, "Menu Items", "emerald") +
          card("🌍", s.cuisines_tracked, "Cuisines", "amber") +
          card("📍", s.cities_covered, "Cities", "rose");
      } catch (e) {
        document.getElementById("status").className = "px-3 py-1.5 rounded-full text-xs font-medium border bg-red-500/10 border-red-500/30 text-red-400 flex items-center gap-2";
        document.getElementById("status-dot").className = "w-2 h-2 rounded-full bg-red-400";
        document.getElementById("status-text").textContent = "API Disconnected";
      }

      try {
        let rs = await (await fetch(API + "/api/restaurants")).json();
        document.getElementById("restaurants").innerHTML = rs.map(r =>
          `<div class="bg-slate-800/50 border border-slate-700/50 rounded-2xl p-5 hover:border-indigo-500/40 transition-all">
            <div class="flex justify-between mb-3">
              <span class="font-semibold">${r.name}</span>
              <span class="text-yellow-400 text-sm">★ ${r.rating}</span>
            </div>
            <div class="text-sm text-slate-400">${r.cuisine} · ${r.location} · ${r.menu_items} items</div>
          </div>`
        ).join("");
      } catch (e) {}

      try {
        let ms = await (await fetch(API + "/api/menu-items")).json();
        document.getElementById("menu").innerHTML = `
          <table class="w-full">
            <thead><tr class="border-b border-slate-700/50">
              <th class="text-left px-5 py-3 text-xs text-slate-400 uppercase">Item</th>
              <th class="text-left px-5 py-3 text-xs text-slate-400 uppercase">Restaurant</th>
              <th class="text-left px-5 py-3 text-xs text-slate-400 uppercase">Category</th>
              <th class="text-right px-5 py-3 text-xs text-slate-400 uppercase">Price</th>
            </tr></thead>
            <tbody>${ms.map(i => `
              <tr class="border-b border-slate-700/30 hover:bg-slate-700/20">
                <td class="px-5 py-3 text-sm text-white font-medium">${i.name}</td>
                <td class="px-5 py-3 text-sm text-slate-300">${i.restaurant}</td>
                <td class="px-5 py-3"><span class="px-2 py-0.5 bg-slate-700/50 rounded text-xs text-slate-300">${i.category}</span></td>
                <td class="px-5 py-3 text-sm text-emerald-400 font-medium text-right">₪${i.price}</td>
              </tr>`).join("")}
            </tbody>
          </table>`;
      } catch (e) {}
    }

    function card(icon, value, label, color) {
      return `<div class="bg-${color}-500/10 border border-${color}-500/20 rounded-2xl p-5">
        <div class="text-2xl mb-1">${icon}</div>
        <div class="text-3xl font-bold">${value}</div>
        <div class="text-sm text-slate-400">${label}</div>
      </div>`;
    }

    init();
  </script>
</body>
</html>
