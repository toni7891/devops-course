on:
    push:
        branches:
            - main

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: 'npm'
            
            - name: install deps
              run: npm ci

            - name: run tests
              run: npm test

    build:
        runs-on: ubuntu-latest
        needs: test
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: 'npm'
            
            - name: install deps
              run: npm ci

            - name: build
              run: npm run build

    docker-release:
        runs-on: ubuntu-latest
        needs: build
        permissions:
            packages: write
            contents: read
        outputs:
            version: ${{ steps.version.outputs.version }}
            sha: ${{ steps.sha.outputs.sha }}
            date: ${{ steps.date.outputs.date }}
            digest: ${{ steps.docker_build.outputs.digest }}

        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: get version
              id: version
              run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

            - name: commit sha
              id: sha
              run: echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

            - name: build date
              id: date
              run: echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

            - name: set up buildx
              uses: docker/setup-buildx-action@v3

            - name: login to github container registry
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: build and push docker image
              id: docker_build
              uses: docker/build-push-action@v6
              with:
                  context: .
                  push: true
                  tags: |
                      ghcr.io/${{ github.repository }}:${{ steps.version.outputs.version }}
                      ghcr.io/${{ github.repository }}:${{ steps.version.outputs.version }}-${{ steps.sha.outputs.sha }}
                  build-args: |
                      VERSION=${{ steps.version.outputs.version }}
                      COMMIT_SHA=${{ steps.sha.outputs.sha }}
                      BUILD_DATE=${{ steps.date.outputs.date }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max


    release-artifact:
        runs-on: ubuntu-latest
        needs: docker-release
        steps:
            - uses: actions/checkout@v4

            - name: generate release json
              run: |
                  echo '{
                      "version": "${{ needs.docker-release.outputs.version }}",
                      "commitSha": "${{ needs.docker-release.outputs.sha }}",
                      "buildDate": "${{ needs.docker-release.outputs.date }}",
                      "imageName": "ghcr.io/${{ github.repository }}",
                      "imageTags": [
                          "ghcr.io/${{ github.repository }}:${{ needs.docker-release.outputs.version }}",
                          "ghcr.io/${{ github.repository }}:${{ needs.docker-release.outputs.version }}-${{ needs.docker-release.outputs.sha }}"
                      ],
                      "imageDigest": "${{ needs.docker-release.outputs.digest }}",
                      "runNumber": "${{ github.run_number }}"
                  }' > release.json

            - name: upload release artifact
              uses: actions/upload-artifact@v4
              with:
                  name: release-manifest
                  path: release.json

