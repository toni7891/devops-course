apiVersion: v1
kind: Pod
metadata:
  name: red-color-api
  labels:
    app: color-api
spec:
  containers:
    - name: color-api
      image: toni7891/color-api:1.3.0
      ports:
        - containerPort: 80

      env:
        - name: DEFAULT_COLOR
          valueFrom:
            configMapKeyRef:
              name: red-config
              key: color