apiVersion: apps/v1

kind: Deployment

metadata:
  name: movie-api-deployment
  namespace: movies
  labels:
    app: movie-api
    team: dev
    environment: prod

spec:
  replicas: 3

  selector:
    matchLabels:
      app: movie-api

  template:
    metadata:
      labels:
        app: movie-api
        team: dev
        environment: prod

    spec:
      containers:
      - name: movie-api
        image: toni7891/movie-api:v2
        ports:
          - containerPort: 3000
            protocol: TCP
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 250m
            memory: 256Mi
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 15

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
