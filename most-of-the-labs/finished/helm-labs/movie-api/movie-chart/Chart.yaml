apiVersion: v2
name: movie-chart
description: A Helm chart for the Movie API (FastAPI + MongoDB)
type: application

# Bump this whenever templates/values change.
version: 0.2.0

# Version of the movie-api application this chart deploys.
appVersion: "1.1"

dependencies:
  - name: mongodb
    version: "19.1.22"
    repository: "https://charts.bitnami.com/bitnami"
    condition: mongodb.enabled
