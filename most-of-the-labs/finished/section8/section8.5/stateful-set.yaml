apiVersion: apps/v1

kind: StatefulSet

metadata:
  name: demo-statefulset

spec:
  serviceName: busybox
  replicas: 2
  selector:
    matchLabels:
      app: busybox

  template:
    metadata:
      labels:
        app: busybox

    spec:
      containers:
        - image: busybox:1.36.1
          name: busybox
          command: ["sh", "-c", "sleep 3600"]

          volumeMounts:
            - name: local-storage
              mountPath: /mnt/local

  volumeClaimTemplates:
    - metadata:
        name: local-storage

      spec:
        accessModes:
        - ReadWriteOnce

        storageClassName: standard

        resources:
          requests:
            storage: 128Mi
