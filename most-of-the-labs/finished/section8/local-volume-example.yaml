apiVersion: v1
kind: PersistentVolume
metadata:
  name: local-volume

spec:
  capacity:
    storage: 1Gi

  volumeMode: Filesystem

  accessModes:
    - ReadWriteOnce

  persistentVolumeReclaimPolicy: Retain

  storageClassName: local-storage

  local:
    path: /mnt/disks/local1

  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - minikube

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: local-volume-claim

spec:
  accessModes:
    - ReadWriteOnce

  volumeMode: Filesystem

  resources:
    requests:
      storage: 1Gi

  storageClassName: local-storage

---

apiVersion: v1
kind: Pod
metadata:
  name: local-volume-pod
spec:
  containers:
  - name: local-volume
    image: busybox:1.36.1
    command: ["sh", "-c", "sleep 3600"]
    volumeMounts:
      - name: local-volume
        mountPath: /mnt/local

  volumes:
    - name: local-volume
      persistentVolumeClaim:
        claimName: local-volume-claim


---
apiVersion: v1
kind: Pod
metadata:
  name: local-volume-pod-2
spec:
  containers:
    - name: local-volume-two
      image: busybox:1.36.1
      command: ["sh", "-c", "sleep 3600"]

      volumeMounts:
        - name: local-volume
          mountPath: /mnt/local2
          # Mounted at different path
          # Same underlying storage

  volumes:
    - name: local-volume
      persistentVolumeClaim:
        claimName: local-volume-claim