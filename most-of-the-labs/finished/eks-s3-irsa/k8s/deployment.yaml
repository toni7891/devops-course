apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-deployment
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx-deployment
  template:
    metadata:
      labels:
        app: nginx-deployment
    spec:
      serviceAccountName: app
      initContainers:
        - name: fetch-s3-file
          image: amazon/aws-cli
          command:
            - "sh"
            - "-c"
            - "aws s3 cp s3://<your-bucket-name>/README.md -"
      containers:
        - name: nginx
          image: nginx:1.14.2
          ports:
            - containerPort: 80
